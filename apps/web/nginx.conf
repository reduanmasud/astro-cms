# Serves the built SPA and proxies /api to the server container, so the
# browser talks to one origin — the same shape the Vite dev proxy gives it
# (see vite.config.ts), just done by nginx instead of Vite in production.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # A client-routed SPA: any path that isn't a real static file falls back
  # to index.html so a refresh on a deep link still loads the app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
