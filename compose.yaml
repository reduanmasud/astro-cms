# Development environment: the API with `node --watch` and the Vite dev
# server, both reading source from the host. Open http://localhost:5173.
#
# After changing dependencies, rebuild and refresh the node_modules volumes:
#   docker compose up --build --renew-anon-volumes

x-dev: &dev
  build:
    context: .
    dockerfile: Dockerfile.dev
  working_dir: /app
  volumes:
    - .:/app
    # Keep the container's Linux node_modules instead of the host's.
    - /app/node_modules
    - /app/apps/collab/node_modules
    - /app/apps/server/node_modules
    - /app/apps/web/node_modules
    - /app/tooling/eslint-config/node_modules

services:
  server:
    <<: *dev
    command: pnpm --filter @astro-cms/server dev
    env_file: .env
    environment:
      PORT: "3000"
      DATA_DIR: /data
      HOCUSPOCUS_PUBLIC_URL: ${HOCUSPOCUS_PUBLIC_URL:-ws://localhost:1234}
      HOCUSPOCUS_INTERNAL_URL: ${HOCUSPOCUS_INTERNAL_URL:-ws://hocuspocus:1234}
      HOCUSPOCUS_JWT_SECRET: ${HOCUSPOCUS_JWT_SECRET:-dev-jwt-secret-change-me-0123456789}
      HOCUSPOCUS_WEBHOOK_SECRET: ${HOCUSPOCUS_WEBHOOK_SECRET:-dev-webhook-secret-change-me-01234}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-astro-cms-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/astro-cms-media}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/collab/node_modules
      - /app/apps/server/node_modules
      - /app/apps/web/node_modules
      - /app/tooling/eslint-config/node_modules
      - cms-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10

  hocuspocus:
    <<: *dev
    command: pnpm --filter @astro-cms/collab start
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/collab/node_modules
      - /app/apps/server/node_modules
      - /app/apps/web/node_modules
      - /app/tooling/eslint-config/node_modules
    environment:
      PORT: "1234"
      CMS_WEBHOOK_URL: http://server:3000/api/collab/webhook
      HOCUSPOCUS_JWT_SECRET: ${HOCUSPOCUS_JWT_SECRET:-dev-jwt-secret-change-me-0123456789}
      HOCUSPOCUS_WEBHOOK_SECRET: ${HOCUSPOCUS_WEBHOOK_SECRET:-dev-webhook-secret-change-me-01234}
    ports:
      - "1234:1234"
    depends_on:
      server:
        condition: service_healthy

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *dev
    command: pnpm --filter @astro-cms/web dev --host 0.0.0.0
    environment:
      API_PROXY_TARGET: http://server:3000
    ports:
      - "5173:5173"
    depends_on:
      server:
        condition: service_healthy
      hocuspocus:
        condition: service_started

volumes:
  cms-data:
  minio-data:
