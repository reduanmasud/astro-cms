# Development environment: the API with `node --watch` and the Vite dev
# server, both reading source from the host. Open http://localhost:5173.
#
# After changing dependencies, rebuild and refresh the node_modules volumes:
#   docker compose up --build --renew-anon-volumes

x-dev: &dev
  build:
    context: .
    dockerfile: Dockerfile.dev
  working_dir: /app
  volumes:
    - .:/app
    # Keep the container's Linux node_modules instead of the host's.
    - /app/node_modules
    - /app/apps/server/node_modules
    - /app/apps/web/node_modules
    - /app/tooling/eslint-config/node_modules

services:
  server:
    <<: *dev
    command: pnpm --filter @astro-cms/server dev
    env_file: .env
    environment:
      PORT: "3000"
      DATA_DIR: /data
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/server/node_modules
      - /app/apps/web/node_modules
      - /app/tooling/eslint-config/node_modules
      - cms-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *dev
    command: pnpm --filter @astro-cms/web dev --host 0.0.0.0
    environment:
      API_PROXY_TARGET: http://server:3000
    ports:
      - "5173:5173"
    depends_on:
      server:
        condition: service_healthy

volumes:
  cms-data:
