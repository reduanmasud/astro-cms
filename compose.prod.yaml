# Production stack: each service runs its own built image (apps/*/Dockerfile)
# instead of the dev containers' bind-mounted source. No insecure fallback
# secrets here — every required value must come from .env, and compose
# refuses to start if one is missing.
#
#   cp .env.example .env   # fill in every value this file references
#   docker compose -f compose.prod.yaml up --build -d
#
# Put a TLS-terminating reverse proxy (Caddy, Traefik, nginx) in front of
# this on a real deployment; nothing here terminates HTTPS itself.

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CMS_PASSWORD: ${CMS_PASSWORD:?set CMS_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN in .env}
      GITHUB_OWNER: ${GITHUB_OWNER:?set GITHUB_OWNER in .env}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:?set GITHUB_REPOSITORY in .env}
      GITHUB_BASE_BRANCH: ${GITHUB_BASE_BRANCH:-main}
      HOCUSPOCUS_PUBLIC_URL: ${HOCUSPOCUS_PUBLIC_URL:-}
      HOCUSPOCUS_INTERNAL_URL: ${HOCUSPOCUS_INTERNAL_URL:-}
      HOCUSPOCUS_JWT_SECRET: ${HOCUSPOCUS_JWT_SECRET:-}
      HOCUSPOCUS_WEBHOOK_SECRET: ${HOCUSPOCUS_WEBHOOK_SECRET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      MCP_TOKEN: ${MCP_TOKEN:-}
      MEDIA_GC_INTERVAL_HOURS: ${MEDIA_GC_INTERVAL_HOURS:-6}
      MEDIA_GC_GRACE_DAYS: ${MEDIA_GC_GRACE_DAYS:-7}
    volumes:
      - cms-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy

  # Optional: not started by `docker compose up` by default (see the
  # `profiles` key). Bring it in with `--profile hocuspocus`, or skip it
  # entirely and point HOCUSPOCUS_* at an external HocusPocus server instead.
  # `:-` here (not `:?`) is deliberate: Compose interpolates every service's
  # environment even when its profile isn't active, so a required-var
  # assertion here would break the default `up` for people who never touch
  # this service. The actual enforcement is in apps/collab/src/main.ts,
  # which exits with a clear error if these are empty at container start.
  hocuspocus:
    profiles: ["hocuspocus"]
    build:
      context: .
      dockerfile: apps/collab/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "1234"
      CMS_WEBHOOK_URL: http://server:3000/api/collab/webhook
      HOCUSPOCUS_JWT_SECRET: ${HOCUSPOCUS_JWT_SECRET:-}
      HOCUSPOCUS_WEBHOOK_SECRET: ${HOCUSPOCUS_WEBHOOK_SECRET:-}
    ports:
      # Only the host side is configurable — HOCUSPOCUS_PUBLIC_URL is what
      # the browser uses to reach this, so its port must match whatever you
      # set here. The container side stays 1234 either way: internal traffic
      # (HOCUSPOCUS_INTERNAL_URL) goes over the Compose network directly and
      # never touches this mapping.
      - "${HOCUSPOCUS_HOST_PORT:-1234}:1234"
    depends_on:
      server:
        condition: service_healthy

  # Optional: not started by `docker compose up` by default (see the
  # `profiles` key). Bring it in with `--profile minio`, or skip it entirely
  # and point S3_* at AWS S3 or Cloudflare R2 instead. `:-` here is
  # deliberate for the same reason as hocuspocus above; MinIO itself refuses
  # to start without real root credentials, so nothing falls back silently.
  minio:
    profiles: ["minio"]
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-}
    ports:
      # Same reasoning as hocuspocus's port above: only the host side is
      # configurable, S3_PUBLIC_URL's port must match S3_HOST_PORT, and
      # S3_ENDPOINT (container-to-container) is unaffected either way since
      # it always targets the container's own 9000. The console port
      # (9001, MinIO's own web UI) isn't referenced by the CMS at all, so it
      # gets a plain override with no matching app-side value to keep in sync.
      - "${S3_HOST_PORT:-9000}:9000"
      - "${S3_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  cms-data:
  minio-data:
