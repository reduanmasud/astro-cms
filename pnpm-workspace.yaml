packages:
  - apps/*
  - packages/*
  - tooling/*

# One version per dependency across the workspace. Packages reference these
# with "catalog:" instead of repeating version ranges.
catalog:
  "@aws-sdk/client-s3": ^3.1131.0
  "@babel/parser": ^8.0.5
  "@babel/types": ^8.0.5
  "@tiptap/core": ^3.31.3
  "@tiptap/extension-image": ^3.31.3
  "@tiptap/extension-placeholder": ^3.31.3
  "@tiptap/extension-table": ^3.31.3
  "@tiptap/pm": ^3.31.3
  "@tiptap/react": ^3.31.3
  "@tiptap/starter-kit": ^3.31.3
  "@tiptap/suggestion": ^3.31.3
  "@types/mdast": ^4.0.4
  jsdom: ^30.0.1
  mdast-util-from-markdown: ^2.0.3
  mdast-util-gfm: ^3.1.0
  mdast-util-mdx: ^3.0.0
  mdast-util-to-markdown: ^2.1.2
  micromark-extension-gfm: ^3.0.0
  micromark-extension-mdxjs: ^3.0.0
  "@eslint/js": ^10.0.1
  "@hocuspocus/extension-webhook": ^4.7.0
  "@modelcontextprotocol/hono": ^2.0.0
  "@modelcontextprotocol/server": ^2.0.0
  "@hocuspocus/provider": ^4.7.0
  "@hocuspocus/server": ^4.7.0
  "@tiptap/extension-collaboration": ^3.31.3
  "@tiptap/extension-collaboration-caret": ^3.31.3
  jose: ^6.2.12
  yjs: ^13.6.32
  y-prosemirror: ^1.3.7
  "@hono/node-server": ^2.1.1
  "@types/better-sqlite3": ^9.6.0
  "@types/node": ^24.0.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.1
  "@vitest/coverage-v8": ^5.0.0
  better-sqlite3: ^13.0.3
  eslint: ^10.10.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.6
  globals: ^17.12.0
  hono: ^4.13.7
  image-size: ^2.0.2
  prettier: ^3.9.6
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: ~7.0.2
  typescript-eslint: ^8.70.0
  vite: ^8.3.0
  vitest: ^5.0.0
  yaml: ^2.9.1

# better-sqlite3 ships prebuilt binaries for every supported platform inside
# the package, so its node-gyp fallback never needs to run.
allowBuilds:
  better-sqlite3: false

minimumReleaseAgeExclude:
  - "@babel/parser@8.0.5"
  - "@babel/types@8.0.5"
  - "@aws-sdk/client-s3@3.1131.0"
  - "@modelcontextprotocol/server@2.0.0"
  - "@modelcontextprotocol/hono@2.0.0"
